<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leon Sai Songs 🎵</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  font-family:inherit;
}

/* ================= HOME ================= */

#home{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#a8ffff,#45dce8,#82f4ef);
}

.float{
  position:absolute;
  pointer-events:none;
  font-size:25px;
  animation:floatUp 6s linear infinite;
  opacity:0;
}

.f1{left:7%;animation-delay:0s}
.f2{left:23%;animation-delay:1.3s}
.f3{left:45%;animation-delay:2.5s}
.f4{left:68%;animation-delay:.7s}
.f5{left:88%;animation-delay:2s}

@keyframes floatUp{
  0%{
    transform:translateY(110vh) rotate(0deg);
    opacity:0;
  }
  15%{opacity:.8}
  100%{
    transform:translateY(-20vh) rotate(360deg);
    opacity:0;
  }
}

/* VIDEO STICKER */

.sticker{
  width:210px;
  height:210px;
  padding:7px;
  position:relative;
  z-index:5;
  background:white;
  border-radius:42% 58% 55% 45% / 48% 42% 58% 52%;
  box-shadow:
    0 15px 35px rgba(0,0,0,.20),
    0 0 0 5px rgba(255,255,255,.65);
  transform:rotate(-3deg);
  animation:stickerFloat 3s ease-in-out infinite;
}

@keyframes stickerFloat{
  0%,100%{margin-top:0}
  50%{margin-top:-10px}
}

#firstVideo{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:38% 62% 50% 50% / 50% 42% 58% 50%;
  background:#111;
  pointer-events:none;
}

.sticker::after{
  content:"✨";
  position:absolute;
  right:-12px;
  top:-16px;
  font-size:32px;
  animation:sparkle 1.5s infinite;
}

@keyframes sparkle{
  0%,100%{
    transform:scale(.8) rotate(0deg);
    opacity:.5;
  }
  50%{
    transform:scale(1.25) rotate(15deg);
    opacity:1;
  }
}

.file-name{
  margin-top:18px;
  font-size:18px;
  font-weight:bold;
  color:#222;
}

.choice{
  width:145px;
  height:42px;
  margin-top:9px;
  border:0;
  border-radius:16px;
  background:#fff3d8;
  font-size:17px;
  font-weight:bold;
}

.choice.sure{
  background:#ffdc88;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(255,190,40,.55);
  }
}

.buttons{
  display:flex;
  gap:7px;
  margin-top:7px;
  z-index:10;
}

.start-btn,
.out-btn{
  border:0;
  color:white;
  font-weight:bold;
  font-size:27px;
  text-shadow:1px 2px 2px rgba(0,0,0,.35);
  cursor:pointer;
  transition:.45s ease;
}

.start-btn{
  width:160px;
  height:68px;
  border-radius:22px;
  background:#00d93a;
}

.out-btn{
  width:85px;
  height:68px;
  border-radius:22px;
  background:#ff3038;
}

.start-btn.big{
  width:250px;
  height:115px;
  font-size:43px;
  border-radius:32px;
  box-shadow:0 0 40px rgba(0,255,70,.7);
}

/* ================= COUNTDOWN ================= */

#countdown{
  display:none;
  width:100%;
  height:100vh;
  align-items:center;
  justify-content:center;
  background:#0ca9eb;
  color:white;
}

#countNumber{
  font-size:190px;
  font-weight:900;
}

/* ================= SONG LIST ================= */

#songs{
  display:none;
  width:100%;
  height:100vh;
  background:white;
  overflow:hidden;
}

.header{
  height:67px;
  width:100%;
  background:#ffd17b;
  display:flex;
  align-items:center;
  position:relative;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.back{
  border:0;
  background:transparent;
  color:white;
  font-size:50px;
  font-weight:bold;
  margin-left:18px;
  cursor:pointer;
}

.out-word{
  font-size:24px;
  font-weight:bold;
  color:#111;
  margin-left:3px;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  color:white;
  font-size:29px;
  font-weight:bold;
  text-shadow:2px 2px #666;
}

.song-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:74px 42px;
  padding:51px 10%;
}

.song{
  height:80px;
  border:0;
  border-radius:25px;
  background:#fff0b8;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.3s;
}

.song:hover{
  transform:translateY(-6px) scale(1.03);
}

.song:active{
  transform:scale(.9);
}

.song::after{
  content:"";
  position:absolute;
  left:-80px;
  top:0;
  width:45px;
  height:100%;
  background:rgba(255,255,255,.6);
  transform:skewX(-20deg);
  animation:shine 2.5s infinite;
}

@keyframes shine{
  from{left:-80px}
  to{left:120%}
}

/* ================= MUSIC PAGE ================= */

#musicPage{
  display:none;
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  color:white;

  background:
    radial-gradient(circle at 20% 20%,rgba(100,80,255,.4),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(0,200,255,.3),transparent 30%),
    linear-gradient(135deg,#080812,#15102d,#05050b);
}

/* moving background lights */

.light{
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.5;
  animation:moveLight 7s ease-in-out infinite alternate;
}

.light.one{
  background:#542dff;
  top:-100px;
  left:-100px;
}

.light.two{
  background:#008cff;
  bottom:-120px;
  right:-100px;
  animation-delay:-3s;
}

@keyframes moveLight{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(120px,80px) scale(1.4);
  }
}

/* back button */

.music-back{
  position:absolute;
  top:25px;
  left:25px;

  width:55px;
  height:55px;

  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;

  background:rgba(255,255,255,.1);
  color:white;

  font-size:30px;
  cursor:pointer;

  z-index:5;
}

/* music card */

.music-card{
  width:min(90vw,430px);
  min-height:430px;

  padding:35px 25px;

  border-radius:35px;

  text-align:center;

  background:rgba(255,255,255,.08);

  border:1px solid rgba(255,255,255,.16);

  box-shadow:
    0 25px 80px rgba(0,0,0,.5);

  backdrop-filter:blur(12px);

  position:relative;
  z-index:2;
}

/* record */

.record{
  width:180px;
  height:180px;

  margin:0 auto 28px;

  border-radius:50%;

  background:
    radial-gradient(circle,#121212 12%,#555 13%,#111 15%,#222 28%,#050505 30%,#222 48%,#050505 50%);

  box-shadow:
    0 0 0 10px rgba(255,255,255,.04),
    0 15px 40px rgba(0,0,0,.5);

  animation:spin 8s linear infinite;

  animation-play-state:paused;
}

.record.playing{
  animation-play-state:running;
}

.record::after{
  content:"🎵";
  position:absolute;
  font-size:40px;
  transform:translate(-50%,-50%);
}

/* Song title */

.song-title{
  font-size:clamp(32px,8vw,48px);
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;

  text-shadow:
    0 0 10px rgba(255,255,255,.4),
    0 0 30px #764cff,
    0 0 60px #3e88ff;

  animation:titleGlow 2s ease-in-out infinite alternate;
}

@keyframes titleGlow{
  from{
    transform:scale(1);
    filter:brightness(1);
  }
  to{
    transform:scale(1.04);
    filter:brightness(1.4);
  }
}

.artist{
  color:rgba(255,255,255,.6);
  margin-bottom:25px;
  font-size:15px;
}

/* audio */

audio{
  width:100%;
  margin-top:10px;
}

/* play button */

.play-btn{
  margin-top:25px;

  width:75px;
  height:75px;

  border:0;
  border-radius:50%;

  background:linear-gradient(135deg,#704cff,#00a8ff);
  color:white;

  font-size:28px;

  cursor:pointer;

  box-shadow:
    0 10px 30px rgba(68,87,255,.5);

  transition:.25s;
}

.play-btn:active{
  transform:scale(.9);
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

@media(max-width:600px){

  .sticker{
    width:205px;
    height:205px;
  }

  .song-grid{
    gap:74px 20px;
    padding:51px 10%;
  }

  .song{
    font-size:16px;
  }

  .title{
    font-size:22px;
  }

  .music-card{
    min-height:400px;
  }
}

</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="home">

  <div class="float f1">✨</div>
  <div class="float f2">💙</div>
  <div class="float f3">⭐</div>
  <div class="float f4">💫</div>
  <div class="float f5">💙</div>

  <div class="sticker">
    <video id="firstVideo"
      autoplay
      muted
      loop
      playsinline
      preload="auto">

      <source src="video.b" type="video/mp4">

    </video>
  </div>

  <div class="file-name">
    add file 1
  </div>

  <button class="choice" id="choiceBtn">
    choice 😊
  </button>

  <div class="buttons">

    <button class="start-btn"
      id="startBtn"
      onclick="startWebsite()">
      start
    </button>

    <button class="out-btn"
      onclick="pressOut()">
      out
    </button>

  </div>

</section>

<!-- ================= COUNTDOWN ================= -->

<section id="countdown">
  <div id="countNumber">3</div>
</section>

<!-- ================= SONG LIST ================= -->

<section id="songs">

  <div class="header">

    <button class="back" onclick="goHome()">
      ←
    </button>

    <span class="out-word">out</span>

    <div class="title">
      Leon sai songs
    </div>

  </div>

  <div class="song-grid">

    <button class="song" onclick="openMusic()">
      ၼူၵ်ႉပိၵ်ႇလႅဝ်
    </button>

    <button class="song">?</button>
    <button class="song">?</button>
    <button class="song">?</button>
    <button class="song">?</button>
    <button class="song">?</button>

  </div>

</section>

<!-- ================= MUSIC PAGE ================= -->

<section id="musicPage">

  <div class="light one"></div>
  <div class="light two"></div>

  <button class="music-back"
    onclick="closeMusic()">
    ←
  </button>

  <div class="music-card">

    <div class="record" id="record"></div>

    <div class="song-title">
      ၼူၵ်ႉပိၵ်ႇလႅဝ်
    </div>

    <div class="artist">
      Leon Sai Songs 🎧
    </div>

    <!--
      သီချင်းဖိုင်ကို
      song.mp3 လို့ နာမည်ပေးပြီး
      GitHub ထဲ upload လုပ်ပါ
    -->

    <audio id="songAudio">
      <source src="song.mp3" type="audio/mpeg">
    </audio>

    <button class="play-btn"
      id="playBtn"
      onclick="toggleMusic()">
      ▶
    </button>

  </div>

</section>

<script>

/* ELEMENTS */

const home = document.getElementById("home");
const countdown = document.getElementById("countdown");
const songs = document.getElementById("songs");
const musicPage = document.getElementById("musicPage");

const firstVideo = document.getElementById("firstVideo");

const startBtn = document.getElementById("startBtn");
const choiceBtn = document.getElementById("choiceBtn");
const countNumber = document.getElementById("countNumber");

const songAudio = document.getElementById("songAudio");
const playBtn = document.getElementById("playBtn");
const record = document.getElementById("record");

/* VIDEO AUTO PLAY */

window.addEventListener("load",function(){

  firstVideo.muted = true;
  firstVideo.play().catch(function(){});

});

/* OUT */

let outCount = 0;

function pressOut(){

  outCount++;

  if(outCount === 1){

    startBtn.classList.add("big");

    choiceBtn.classList.add("sure");

    choiceBtn.innerHTML =
      "are you sure? 🤔";

  }

  else if(outCount === 2){

    choiceBtn.innerHTML =
      "ARE YOU SURE? 😳";

  }

  else{

    document.body.style.opacity = "0";

    setTimeout(function(){

      window.location.href = "about:blank";

    },700);

  }

}

/* START */

function startWebsite(){

  firstVideo.pause();

  home.style.display = "none";
  countdown.style.display = "flex";

  let number = 3;

  countNumber.innerHTML = number;

  const timer = setInterval(function(){

    number--;

    if(number > 0){

      countNumber.innerHTML = number;

    }else{

      clearInterval(timer);

      countdown.style.display = "none";
      songs.style.display = "block";

    }

  },1000);

}

/* HOME */

function goHome(){

  songs.style.display = "none";
  musicPage.style.display = "none";
  home.style.display = "flex";

  outCount = 0;

  startBtn.classList.remove("big");
  choiceBtn.classList.remove("sure");

  choiceBtn.innerHTML = "choice 😊";

  firstVideo.play().catch(function(){});

}

/* OPEN MUSIC */

function openMusic(){

  songs.style.display = "none";

  musicPage.style.display = "flex";

}

/* CLOSE MUSIC */

function closeMusic(){

  songAudio.pause();

  record.classList.remove("playing");

  playBtn.innerHTML = "▶";

  musicPage.style.display = "none";

  songs.style.display = "block";

}

/* PLAY / PAUSE */

function toggleMusic(){

  if(songAudio.paused){

    songAudio.play();

    playBtn.innerHTML = "Ⅱ";

    record.classList.add("playing");

  }else{

    songAudio.pause();

    playBtn.innerHTML = "▶";

    record.classList.remove("playing");

  }

}

/* SONG END */

songAudio.addEventListener("ended",function(){

  playBtn.innerHTML = "▶";

  record.classList.remove("playing");

});

</script>

</body>
</html>
