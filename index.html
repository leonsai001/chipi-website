<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Sai Songs 🎵</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ================= HOME ================= */

#home{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#a8ffff,#45dce8,#82f4ef);
}

/* Floating decorations */

.float{
  position:absolute;
  pointer-events:none;
  font-size:25px;
  animation:floatUp 6s linear infinite;
  opacity:0;
}

.f1{left:7%;animation-delay:0s}
.f2{left:23%;animation-delay:1.3s}
.f3{left:45%;animation-delay:2.5s}
.f4{left:68%;animation-delay:.7s}
.f5{left:88%;animation-delay:2s}

@keyframes floatUp{
  0%{
    transform:translateY(110vh) rotate(0deg);
    opacity:0;
  }
  15%{opacity:.8}
  100%{
    transform:translateY(-20vh) rotate(360deg);
    opacity:0;
  }
}

/* ================= VIDEO STICKER ================= */

.sticker{
  width:210px;
  height:210px;
  padding:7px;
  position:relative;
  z-index:5;

  background:white;

  border-radius:42% 58% 55% 45% / 48% 42% 58% 52%;

  box-shadow:
    0 15px 35px rgba(0,0,0,.20),
    0 0 0 5px rgba(255,255,255,.65);

  transform:rotate(-3deg);

  animation:
    stickerIn .8s ease,
    stickerFloat 3s ease-in-out infinite;
}

@keyframes stickerIn{
  from{
    opacity:0;
    transform:scale(.4) rotate(-15deg);
  }
  to{
    opacity:1;
    transform:scale(1) rotate(-3deg);
  }
}

@keyframes stickerFloat{
  0%,100%{
    margin-top:0;
  }
  50%{
    margin-top:-10px;
  }
}

/* Video itself */

#firstVideo{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  border-radius:
    38% 62% 50% 50% /
    50% 42% 58% 50%;

  background:#111;

  border:0;

  outline:none;

  /* no controls interaction */
  pointer-events:none;

  user-select:none;
}

/* little sticker shine */

.sticker::after{
  content:"✨";

  position:absolute;

  right:-12px;
  top:-16px;

  font-size:32px;

  animation:sparkle 1.5s infinite;
}

@keyframes sparkle{
  0%,100%{
    transform:scale(.8) rotate(0deg);
    opacity:.5;
  }
  50%{
    transform:scale(1.25) rotate(15deg);
    opacity:1;
  }
}


/* ================= ADD FILE TEXT ================= */

.file-name{
  margin-top:18px;
  font-size:18px;
  font-weight:bold;
  color:#222;
  position:relative;
  z-index:5;
}


/* ================= CHOICE ================= */

.choice{
  width:145px;
  height:42px;
  margin-top:9px;

  border:0;
  border-radius:16px;

  background:#fff3d8;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:0 5px 15px rgba(0,0,0,.1);

  transition:.3s;
}

.choice.sure{
  background:#ffdc88;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(255,190,40,.55);
  }
}


/* ================= BUTTONS ================= */

.buttons{
  display:flex;
  gap:7px;
  margin-top:7px;
  z-index:10;
}

.start-btn,
.out-btn{
  border:0;
  color:white;
  font-weight:bold;
  font-size:27px;
  text-shadow:1px 2px 2px rgba(0,0,0,.35);
  cursor:pointer;

  transition:
    .45s ease;
}

.start-btn{
  width:160px;
  height:68px;
  border-radius:22px;
  background:#00f13b;
}

.out-btn{
  width:85px;
  height:68px;
  border-radius:22px;
  background:#ff3038;
}

.start-btn:active,
.out-btn:active{
  transform:scale(.88);
}

.start-btn.big{
  width:250px;
  height:115px;
  font-size:43px;
  border-radius:32px;
  box-shadow:0 0 40px rgba(0,255,70,.7);
}


/* ================= COUNTDOWN ================= */

#countdown{
  display:none;
  width:100%;
  height:100vh;
  align-items:center;
  justify-content:center;
  background:#0ca9eb;
  color:white;
}

#countNumber{
  font-size:190px;
  font-weight:900;
  animation:countPop .8s ease;
}

@keyframes countPop{
  0%{
    transform:scale(1.7);
    opacity:0;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}


/* ================= SONG PAGE ================= */

#songs{
  display:none;
  width:100%;
  height:100vh;
  background:white;
  overflow:hidden;
}

.header{
  height:67px;
  width:100%;
  background:#ffd17b;

  display:flex;
  align-items:center;

  position:relative;

  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.back{
  border:0;
  background:transparent;
  color:white;

  font-size:50px;
  font-weight:bold;

  margin-left:18px;

  cursor:pointer;

  text-shadow:1px 2px 2px #777;
}

.out-word{
  font-size:24px;
  font-weight:bold;
  color:#111;
  margin-left:3px;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  white-space:nowrap;

  color:white;
  font-size:29px;
  font-weight:bold;

  text-shadow:
    2px 2px #666,
    -1px -1px #666;
}


/* ================= SONG BUTTONS ================= */

.song-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:74px 42px;
  padding:51px 10%;
}

.song{
  height:80px;

  border:0;
  border-radius:25px;

  background:#fff0b8;

  font-size:20px;
  font-weight:bold;

  cursor:pointer;

  position:relative;
  overflow:hidden;

  transition:.3s;
}

.song:active{
  transform:scale(.88);
}

.song:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 12px 25px rgba(255,190,50,.3);
}

.song::after{
  content:"";

  position:absolute;
  left:-80px;
  top:0;

  width:45px;
  height:100%;

  background:rgba(255,255,255,.6);

  transform:skewX(-20deg);

  animation:shine 2.5s infinite;
}

@keyframes shine{
  from{left:-80px}
  to{left:120%}
}


/* ================= HEARTS ================= */

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:53px;
  margin-top:2px;
}

.heart{
  width:110px;
  height:92px;

  border:0;
  border-radius:25px;

  font-size:30px;

  cursor:pointer;

  transition:.3s;
}

.heart:first-child{
  background:#00f45a;
}

.heart:last-child{
  background:#ff5a0a;
}


/* ================= VIDEO.C PAGE ================= */

#videoPage{
  display:none;

  width:100%;
  height:100vh;

  padding:20px;

  background:
    linear-gradient(135deg,#74f5ef,#a19aff);

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:18px;
}

.video-title{
  color:white;
  font-size:25px;
  font-weight:bold;
  text-shadow:2px 2px 3px #666;
}

#songVideo{
  width:min(92vw,700px);
  max-height:72vh;

  background:#000;

  border-radius:24px;

  box-shadow:0 18px 50px rgba(0,0,0,.3);
}

.video-back{
  border:0;
  background:white;

  padding:13px 27px;

  border-radius:20px;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

  .sticker{
    width:205px;
    height:205px;
  }

  .song-grid{
    gap:74px 20px;
    padding:51px 10%;
  }

  .song{
    font-size:18px;
  }

  .title{
    font-size:24px;
  }

  #countNumber{
    font-size:180px;
  }
}
</style>
</head>

<body>


<!-- ==========================================
     FIRST PAGE
========================================== -->

<section id="home">

  <div class="float f1">✨</div>
  <div class="float f2">🎊</div>
  <div class="float f3">⭐</div>
  <div class="float f4">💫</div>
  <div class="float f5">💙</div>


  <!--
    video.b
    Sticker ပုံစံ
    Controls မပါ
    Auto Play
    Loop
  -->

  <div class="sticker">

    <video
      id="firstVideo"
      autoplay
      muted
      loop
      playsinline
      preload="auto">

      <source src="video.b" type="video/mp4">

    </video>

  </div>


  <div class="file-name">
  
  </div>


  <button
    class="choice"
    id="choiceBtn">

    choice 😊

  </button>


  <div class="buttons">

    <button
      class="start-btn"
      id="startBtn"
      onclick="startWebsite()">

      start

    </button>


    <button
      class="out-btn"
      onclick="pressOut()">

      out

    </button>

  </div>

</section>



<!-- ==========================================
     COUNTDOWN
========================================== -->

<section id="countdown">

  <div id="countNumber">
    3
  </div>

</section>



<!-- ==========================================
     SONG PAGE
========================================== -->

<section id="songs">


  <div class="header">

    <button
      class="back"
      onclick="goHome()">

      ←

    </button>


    <span class="out-word">
      out
    </span>


    <div class="title">
      Leon sai songs
    </div>

  </div>


  <div class="song-grid">


    <button
      class="song"
      onclick="openVideo()">

      (လုယွၼ်ႉၵဝ်)

    </button>


    <button class="song">?</button>
    <button class="song">?</button>
    <button class="song">?</button>
    <button class="song">?</button>
    <button class="song">?</button>

  </div>


  <div class="bottom-buttons">

    <button
      class="heart"
      onclick="heartEffect(this)">

      ❤️

    </button>


    <button
      class="heart"
      onclick="heartEffect(this)">

      💔

    </button>

  </div>

</section>



<!-- ==========================================
     VIDEO.C
========================================== -->

<section id="videoPage">

  <div class="video-title">
    🎵 (လုယွၼ်ႉၵဝ်) 🎵
  </div>


  <video
    id="songVideo"
    controls
    playsinline
    preload="metadata">

    <source
      src="video.c"
      type="video/mp4">

  </video>


  <button
    class="video-back"
    onclick="closeVideo()">

    ← ပြန်သွားမယ်

  </button>

</section>



<script>

/* ==========================================
   FIRST VIDEO
========================================== */

const firstVideo =
  document.getElementById("firstVideo");


/*
  Website ဝင်တာနဲ့
  video.b ကို auto play
*/

window.addEventListener(
  "load",
  function(){

    firstVideo.muted = true;

    firstVideo.loop = true;

    firstVideo.play().catch(
      function(){

        console.log(
          "Browser blocked autoplay"
        );

      }
    );

  }
);


/* ==========================================
   ELEMENTS
========================================== */

const home =
  document.getElementById("home");

const countdown =
  document.getElementById("countdown");

const songs =
  document.getElementById("songs");

const videoPage =
  document.getElementById("videoPage");

const startBtn =
  document.getElementById("startBtn");

const choiceBtn =
  document.getElementById("choiceBtn");

const countNumber =
  document.getElementById("countNumber");

const songVideo =
  document.getElementById("songVideo");


/* ==========================================
   OUT
========================================== */

let outCount = 0;

function pressOut(){

  outCount++;


  if(outCount === 1){

    startBtn.classList.add("big");

    choiceBtn.classList.add("sure");

    choiceBtn.innerHTML =
      "are you sure? 🤔";

    popup("Are you sure? 💩");

  }


  else if(outCount === 2){

    startBtn.classList.add("big");

    choiceBtn.innerHTML =
      "ARE YOU SURE? 🥺😭";

    popup("One more time... 😑");

  }


  else if(outCount >= 3){

    document.body.style.transition =
      "opacity .7s";

    document.body.style.opacity =
      "0";


    setTimeout(
      function(){

        window.location.href =
          "about:blank";

      },
      700
    );

  }
}


/* ==========================================
   START
========================================== */

function startWebsite(){

  firstVideo.pause();

  home.style.display =
    "none";

  countdown.style.display =
    "flex";


  let number = 3;

  countNumber.innerHTML =
    number;


  let timer =
    setInterval(
      function(){

        number--;


        if(number > 0){

          countNumber.innerHTML =
            number;

          countNumber.style.animation =
            "none";

          void countNumber.offsetWidth;

          countNumber.style.animation =
            "countPop .8s ease";

        }


        else{

          clearInterval(timer);

          countdown.style.display =
            "none";

          songs.style.display =
            "block";

        }

      },
      1000
    );
}


/* ==========================================
   BACK HOME
========================================== */

function goHome(){

  songs.style.display =
    "none";

  videoPage.style.display =
    "none";

  countdown.style.display =
    "none";

  home.style.display =
    "flex";


  outCount = 0;

  startBtn.classList.remove("big");

  choiceBtn.classList.remove("sure");

  choiceBtn.innerHTML =
    "choice 😊";


  songVideo.pause();


  firstVideo.play().catch(
    function(){}
  );
}


/* ==========================================
   VIDEO.C
========================================== */

function openVideo(){

  songs.style.display =
    "none";

  videoPage.style.display =
    "flex";

  songVideo.currentTime =
    0;

  songVideo.play().catch(
    function(){}
  );
}


/* ==========================================
   CLOSE VIDEO
========================================== */

function closeVideo(){

  songVideo.pause();

  videoPage.style.display =
    "none";

  songs.style.display =
    "block";
}


/* ==========================================
   HEART EFFECT
========================================== */

function heartEffect(button){

  button.animate(
    [
      {transform:"scale(1)"},
      {transform:"scale(1.3) rotate(8deg)"},
      {transform:"scale(1)"}
    ],
    {
      duration:400
    }
  );


  for(let i=0;i<8;i++){

    const heart =
      document.createElement("div");

    heart.innerHTML =
      "🖕";

    heart.style.position =
      "fixed";

    const rect =
      button.getBoundingClientRect();

    heart.style.left =
      rect.left +
      rect.width / 2 +
      "px";

    heart.style.top =
      rect.top +
      "px";

    heart.style.fontSize =
      "22px";

    heart.style.zIndex =
      "9999";

    heart.style.pointerEvents =
      "none";

    document.body.appendChild(
      heart
    );


    const x =
      (Math.random()-.5)*180;

    const y =
      -(Math.random()*180+50);


    heart.animate(
      [
        {
          transform:
            "translate(0,0) scale(1)",
          opacity:1
        },

        {
          transform:
            `translate(${x}px,${y}px) scale(.3)`,
          opacity:0
        }
      ],
      {
        duration:900,
        easing:"ease-out"
      }
    );


    setTimeout(
      function(){
        heart.remove();
      },
      900
    );

  }
}


/* ==========================================
   POPUP
========================================== */

function popup(text){

  const box =
    document.createElement("div");

  box.innerHTML =
    text;

  box.style.position =
    "fixed";

  box.style.left =
    "50%";

  box.style.top =
    "15%";

  box.style.transform =
    "translateX(-50%) scale(.5)";

  box.style.padding =
    "14px 24px";

  box.style.borderRadius =
    "20px";

  box.style.background =
    "rgba(255,255,255,.95)";

  box.style.color =
    "#222";

  box.style.fontSize =
    "18px";

  box.style.fontWeight =
    "bold";

  box.style.zIndex =
    "10000";

  box.style.boxShadow =
    "0 10px 30px rgba(0,0,0,.2)";

  document.body.appendChild(
    box
  );


  box.animate(
    [
      {
        transform:
          "translateX(-50%) scale(.5)",
        opacity:0
      },

      {
        transform:
          "translateX(-50%) scale(1)",
        opacity:1
      },

      {
        transform:
          "translateX(-50%) scale(1)",
        opacity:1
      },

      {
        transform:
          "translateX(-50%) scale(.5)",
        opacity:0
      }
    ],
    {
      duration:1700,
      easing:"ease-in-out"
    }
  );


  setTimeout(
    function(){
      box.remove();
    },
    1700
  );
}

</script>

</body>
</html>
