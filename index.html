<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Sai Songs 🎵</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

/* =========================
   HOME PAGE
========================= */

#home{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.25),transparent 25%),
    linear-gradient(135deg,#8ff8f5,#35c8dc,#65e9ed);
}

/* floating decorations */

.float{
  position:absolute;
  font-size:25px;
  opacity:.6;
  pointer-events:none;
  animation:floatUp 6s linear infinite;
}

.f1{left:8%;animation-delay:0s;}
.f2{left:23%;animation-delay:1.5s;}
.f3{left:43%;animation-delay:3s;}
.f4{left:66%;animation-delay:.8s;}
.f5{left:85%;animation-delay:2.2s;}

@keyframes floatUp{
  0%{
    transform:translateY(110vh) rotate(0deg);
    opacity:0;
  }
  15%{
    opacity:.7;
  }
  100%{
    transform:translateY(-20vh) rotate(360deg);
    opacity:0;
  }
}

/* main video box */

.file-box{
  width:320px;
  min-height:360px;
  padding:14px;
  border-radius:24px;
  background:rgba(255,255,255,.96);
  box-shadow:
    0 20px 50px rgba(0,0,0,.18),
    inset 0 0 0 2px rgba(255,255,255,.5);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:5;
  animation:boxAppear .8s ease;
}

@keyframes boxAppear{
  from{
    opacity:0;
    transform:scale(.75) translateY(20px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

/* VIDEO.B */

#firstVideo{
  width:100%;
  height:245px;
  display:block;
  object-fit:cover;
  background:#111;
  border-radius:17px;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

/* label */

.file-name{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  color:#222;
}

/* choice button */

.choice{
  width:145px;
  height:42px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background:#fff4dc;
  color:#222;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(0,0,0,.08);
  transition:.3s;
}

.choice:active{
  transform:scale(.9);
}

.choice.sure{
  background:#ffe09b;
  animation:choicePulse 1s infinite;
}

@keyframes choicePulse{
  50%{
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(255,190,50,.5);
  }
}

/* buttons */

.buttons{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
  position:relative;
  z-index:6;
}

.start-btn,
.out-btn{
  border:none;
  color:white;
  font-weight:bold;
  font-size:27px;
  text-shadow:1px 2px 2px rgba(0,0,0,.35);
  cursor:pointer;
  transition:
    width .45s ease,
    height .45s ease,
    font-size .45s ease,
    transform .25s ease,
    box-shadow .3s ease;
}

.start-btn{
  width:160px;
  height:68px;
  border-radius:22px;
  background:#00f33c;
}

.out-btn{
  width:85px;
  height:68px;
  border-radius:22px;
  background:#ff3038;
}

.start-btn:active,
.out-btn:active{
  transform:scale(.88);
}

.start-btn.big{
  width:250px;
  height:115px;
  font-size:43px;
  border-radius:32px;
  box-shadow:0 0 40px rgba(0,255,70,.7);
}

/* =========================
   COUNTDOWN
========================= */

#countdown{
  display:none;
  width:100%;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  background:#10a9ed;
  color:white;
}

#countNumber{
  font-size:220px;
  font-weight:900;
  animation:numberPop .9s ease;
  text-shadow:0 8px 20px rgba(0,0,0,.1);
}

@keyframes numberPop{
  0%{
    transform:scale(1.7);
    opacity:0;
  }
  60%{
    transform:scale(.95);
    opacity:1;
  }
  100%{
    transform:scale(1);
  }
}

/* =========================
   SONG PAGE
========================= */

#songs{
  display:none;
  width:100%;
  min-height:100vh;
  background:white;
  position:relative;
}

/* header */

.header{
  width:100%;
  height:67px;
  background:#ffd17b;
  display:flex;
  align-items:center;
  position:relative;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.back{
  border:none;
  background:transparent;
  color:white;
  font-size:50px;
  line-height:1;
  font-weight:bold;
  margin-left:18px;
  cursor:pointer;
  text-shadow:1px 2px 2px #777;
  transition:.25s;
}

.back:active{
  transform:scale(.8);
}

.out-word{
  color:#111;
  font-size:24px;
  font-weight:bold;
  margin-left:3px;
  text-shadow:1px 1px 0 white;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  color:white;
  font-size:29px;
  font-weight:bold;
  text-shadow:
    2px 2px 0 #666,
    -1px -1px 0 #666;
}

/* songs */

.song-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:74px 42px;
  padding:51px 10%;
}

.song{
  height:80px;
  border:none;
  border-radius:25px;
  background:#fff0b8;
  color:#111;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.3s;
  box-shadow:0 4px 12px rgba(255,200,80,.08);
}

.song:active{
  transform:scale(.88);
}

.song:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 12px 25px rgba(255,190,50,.3);
}

/* shine animation */

.song::after{
  content:"";
  position:absolute;
  top:0;
  left:-80px;
  width:45px;
  height:100%;
  background:rgba(255,255,255,.55);
  transform:skewX(-20deg);
  animation:shine 2.5s infinite;
}

@keyframes shine{
  0%{left:-80px;}
  100%{left:120%;}
}

/* bottom buttons */

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:53px;
  margin-top:2px;
}

.heart{
  width:110px;
  height:92px;
  border:none;
  border-radius:25px;
  font-size:30px;
  cursor:pointer;
  transition:.3s;
}

.heart:first-child{
  background:#00f45a;
}

.heart:last-child{
  background:#ff5a0a;
}

.heart:active{
  transform:scale(.85);
}

/* =========================
   VIDEO.C PAGE
========================= */

#videoPage{
  display:none;
  width:100%;
  min-height:100vh;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.25),transparent 25%),
    linear-gradient(135deg,#75f5f0,#9e9aff);
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}

.video-title{
  color:white;
  font-size:25px;
  font-weight:bold;
  text-shadow:2px 2px 3px #666;
}

#songVideo{
  width:min(92vw,700px);
  max-height:72vh;
  background:#000;
  border-radius:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);
}

.video-back{
  border:none;
  background:white;
  color:#222;
  padding:13px 27px;
  border-radius:20px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 7px 20px rgba(0,0,0,.15);
}

.video-back:active{
  transform:scale(.9);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .file-box{
    width:320px;
    min-height:360px;
  }

  #firstVideo{
    height:245px;
  }

  .start-btn{
    width:160px;
    height:68px;
  }

  .out-btn{
    width:85px;
    height:68px;
  }

  .start-btn.big{
    width:250px;
    height:115px;
  }

  #countNumber{
    font-size:180px;
  }

  .title{
    font-size:24px;
  }

  .song-grid{
    gap:74px 20px;
    padding:51px 10%;
  }

  .song{
    font-size:18px;
  }
}
</style>
</head>

<body>


<!-- ==================================================
     PAGE 1
================================================== -->

<section id="home">

  <div class="float f1">✨</div>
  <div class="float f2">💙</div>
  <div class="float f3">⭐</div>
  <div class="float f4">💫</div>
  <div class="float f5">💙</div>


  <!-- video.b replaces add file 1 -->

  <div class="file-box">

    <video
      id="firstVideo"
      controls
      playsinline
      preload="metadata">

      <source src="video.b" type="video/mp4">
      <source src="video-b.mp4" type="video/mp4">

      Your browser does not support video.
    </video>

    <div class="file-name">
      add file 1
    </div>

    <button
      class="choice"
      id="choiceBtn">
      choice 😊
    </button>

  </div>


  <div class="buttons">

    <button
      class="start-btn"
      id="startBtn"
      onclick="startWebsite()">
      start
    </button>

    <button
      class="out-btn"
      onclick="pressOut()">
      out
    </button>

  </div>

</section>


<!-- ==================================================
     PAGE 2 : COUNTDOWN
================================================== -->

<section id="countdown">

  <div id="countNumber">
    3
  </div>

</section>


<!-- ==================================================
     PAGE 3 : SONG LIST
================================================== -->

<section id="songs">

  <div class="header">

    <button
      class="back"
      onclick="goHome()">
      ←
    </button>

    <span class="out-word">
      out
    </span>

    <div class="title">
      Leon sai songs
    </div>

  </div>


  <div class="song-grid">

    <button
      class="song"
      onclick="openVideo()">
      (လုယွၼ်ႉၵဝ်)
    </button>

    <button
      class="song"
      onclick="openVideo()">
      ?
    </button>

    <button
      class="song"
      onclick="openVideo()">
      ?
    </button>

    <button
      class="song"
      onclick="openVideo()">
      ?
    </button>

    <button
      class="song"
      onclick="openVideo()">
      ?
    </button>

    <button
      class="song"
      onclick="openVideo()">
      ?
    </button>

  </div>


  <div class="bottom-buttons">

    <button
      class="heart"
      onclick="heartEffect(this)">
      ❤️
    </button>

    <button
      class="heart"
      onclick="heartEffect(this)">
      💔
    </button>

  </div>

</section>


<!-- ==================================================
     PAGE 4 : VIDEO.C
================================================== -->

<section id="videoPage">

  <div class="video-title">
    🎵 (လုယွၼ်ႉၵဝ်) 🎵
  </div>

  <video
    id="songVideo"
    controls
    playsinline
    preload="metadata">

    <source src="video.c" type="video/mp4">
    <source src="video-c.mp4" type="video/mp4">

    Your browser does not support video.
  </video>

  <button
    class="video-back"
    onclick="closeVideo()">
    ← ပြန်သွားမယ်
  </button>

</section>


<script>

/* ==================================================
   VARIABLES
================================================== */

let outCount = 0;

const home =
  document.getElementById("home");

const countdown =
  document.getElementById("countdown");

const songs =
  document.getElementById("songs");

const videoPage =
  document.getElementById("videoPage");

const startBtn =
  document.getElementById("startBtn");

const choiceBtn =
  document.getElementById("choiceBtn");

const countNumber =
  document.getElementById("countNumber");

const firstVideo =
  document.getElementById("firstVideo");

const songVideo =
  document.getElementById("songVideo");


/* ==================================================
   OUT BUTTON
================================================== */

function pressOut(){

  outCount++;

  if(outCount === 1){

    startBtn.classList.add("big");

    choiceBtn.classList.add("sure");

    choiceBtn.innerHTML =
      "are you sure? 🤔";

    message("Are you sure? 😳");

  }

  else if(outCount === 2){

    startBtn.classList.add("big");

    choiceBtn.innerHTML =
      "ARE YOU SURE? 😳";

    message("One more time... 😳");

  }

  else if(outCount >= 3){

    /*
      3 ကြိမ်နှိပ်မှ
      အပြင်ထွက်ခွင့်ပေးမယ်
    */

    document.body.style.transition =
      "opacity .7s ease";

    document.body.style.opacity = "0";

    setTimeout(function(){

      window.location.href =
        "about:blank";

    },700);
  }
}


/* ==================================================
   START BUTTON
================================================== */

function startWebsite(){

  home.style.display = "none";

  countdown.style.display = "flex";

  let number = 3;

  countNumber.innerHTML = number;

  countNumber.style.animation = "none";

  void countNumber.offsetWidth;

  countNumber.style.animation =
    "numberPop .9s ease";


  const timer =
    setInterval(function(){

      number--;

      if(number > 0){

        countNumber.innerHTML =
          number;

        countNumber.style.animation =
          "none";

        void countNumber.offsetWidth;

        countNumber.style.animation =
          "numberPop .9s ease";

      }

      else{

        clearInterval(timer);

        countdown.style.display =
          "none";

        songs.style.display =
          "block";
      }

    },1000);
}


/* ==================================================
   BACK TO HOME
================================================== */

function goHome(){

  songs.style.display = "none";

  videoPage.style.display = "none";

  countdown.style.display = "none";

  home.style.display = "flex";

  outCount = 0;

  startBtn.classList.remove("big");

  choiceBtn.classList.remove("sure");

  choiceBtn.innerHTML =
    "choice 😊";

  songVideo.pause();

  firstVideo.pause();

}


/* ==================================================
   OPEN VIDEO.C
================================================== */

function openVideo(){

  songs.style.display =
    "none";

  videoPage.style.display =
    "flex";

  songVideo.currentTime = 0;

  /*
    Browser က autoplay ခွင့်ပြုရင်
    တစ်ခါတည်း play မယ်။
    မခွင့်ပြုရင် Video ရဲ့ Play ကို
    နှိပ်ပြီးကြည့်လို့ရတယ်။
  */

  songVideo.play().catch(function(){

    console.log(
      "Autoplay blocked by browser."
    );

  });
}


/* ==================================================
   CLOSE VIDEO
================================================== */

function closeVideo(){

  songVideo.pause();

  videoPage.style.display =
    "none";

  songs.style.display =
    "block";
}


/* ==================================================
   HEART EFFECT
================================================== */

function heartEffect(button){

  button.animate(
    [
      {
        transform:"scale(1)"
      },
      {
        transform:"scale(1.3) rotate(8deg)"
      },
      {
        transform:"scale(1)"
      }
    ],
    {
      duration:400
    }
  );


  for(let i=0;i<8;i++){

    const heart =
      document.createElement("div");

    heart.innerHTML = "💖";

    heart.style.position =
      "fixed";

    const rect =
      button.getBoundingClientRect();

    heart.style.left =
      (rect.left +
      rect.width / 2) + "px";

    heart.style.top =
      rect.top + "px";

    heart.style.fontSize =
      "22px";

    heart.style.zIndex =
      "9999";

    heart.style.pointerEvents =
      "none";

    document.body.appendChild(
      heart
    );


    const x =
      (Math.random() - .5) * 180;

    const y =
      -(Math.random() * 180 + 50);


    heart.animate(
      [
        {
          transform:
            "translate(0,0) scale(1)",
          opacity:1
        },
        {
          transform:
            `translate(${x}px,${y}px) scale(.3)`,
          opacity:0
        }
      ],
      {
        duration:900,
        easing:"ease-out"
      }
    );


    setTimeout(function(){

      heart.remove();

    },900);

  }
}


/* ==================================================
   POPUP MESSAGE
================================================== */

function message(text){

  const box =
    document.createElement("div");

  box.innerHTML = text;

  box.style.position =
    "fixed";

  box.style.left =
    "50%";

  box.style.top =
    "15%";

  box.style.transform =
    "translateX(-50%) scale(.5)";

  box.style.padding =
    "14px 24px";

  box.style.borderRadius =
    "20px";

  box.style.background =
    "rgba(255,255,255,.95)";

  box.style.color =
    "#222";

  box.style.fontSize =
    "18px";

  box.style.fontWeight =
    "bold";

  box.style.zIndex =
    "10000";

  box.style.boxShadow =
    "0 10px 30px rgba(0,0,0,.2)";

  document.body.appendChild(box);


  box.animate(
    [
      {
        transform:
          "translateX(-50%) scale(.5)",
        opacity:0
      },
      {
        transform:
          "translateX(-50%) scale(1)",
        opacity:1
      },
      {
        transform:
          "translateX(-50%) scale(1)",
        opacity:1
      },
      {
        transform:
          "translateX(-50%) scale(.5)",
        opacity:0
      }
    ],
    {
      duration:1700,
      easing:"ease-in-out"
    }
  );


  setTimeout(function(){

    box.remove();

  },1700);
}

</script>

</body>
</html>
