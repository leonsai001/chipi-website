<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leon Sai Songs 🎵</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ================= FIRST PAGE ================= */

#home{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:
    radial-gradient(circle at 15% 20%,#ff45c8 0,transparent 25%),
    radial-gradient(circle at 85% 30%,#356cff 0,transparent 27%),
    radial-gradient(circle at 50% 100%,#8b26ff 0,transparent 35%),
    linear-gradient(145deg,#05051b,#11104b,#060722);

  color:white;
}

/* stars */

.star{
  position:absolute;
  color:white;
  font-size:14px;
  opacity:.8;
  animation:twinkle 2s ease-in-out infinite alternate;
}

.s1{top:8%;left:8%}
.s2{top:17%;left:27%;animation-delay:.4s}
.s3{top:11%;right:13%;animation-delay:.8s}
.s4{top:42%;left:6%;animation-delay:1s}
.s5{top:49%;right:7%;animation-delay:.2s}
.s6{bottom:25%;left:18%;animation-delay:1.3s}
.s7{bottom:17%;right:18%;animation-delay:.7s}
.s8{top:30%;right:30%;animation-delay:1.5s}

@keyframes twinkle{
  from{
    opacity:.25;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1.5);
  }
}

/* floating hearts */

.heart{
  position:absolute;
  font-size:22px;
  animation:heartFloat 7s linear infinite;
  opacity:0;
}

.h1{left:8%;animation-delay:0s}
.h2{left:25%;animation-delay:2s}
.h3{right:18%;animation-delay:1s}
.h4{right:5%;animation-delay:3s}

@keyframes heartFloat{
  0%{
    transform:translateY(105vh) rotate(0);
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  100%{
    transform:translateY(-20vh) rotate(360deg);
    opacity:0;
  }
}

/* moon */

.moon{
  position:absolute;
  top:38px;
  right:28px;

  width:55px;
  height:55px;
  border-radius:50%;

  background:#fff5bd;
  box-shadow:
    0 0 20px #fff4a0,
    0 0 50px #7a7cff;

  overflow:hidden;
}

.moon:after{
  content:"";
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#08082a;
  left:18px;
  top:-8px;
}

/* ================= TITLE ================= */

.logo{
  margin-top:25px;
  text-align:center;
  z-index:5;
}

.logo h1{
  margin:0;

  font-size:clamp(38px,10vw,65px);
  font-weight:900;
  font-style:italic;
  letter-spacing:2px;

  background:linear-gradient(
    90deg,
    #ff61d8,
    #ffffff,
    #55c8ff,
    #ff61d8
  );

  background-size:300% auto;

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:gradientMove 4s linear infinite;

  text-shadow:
    0 0 15px rgba(255,70,220,.5);
}

.logo p{
  margin:0;
  font-size:15px;
  letter-spacing:4px;
  color:#ddd9ff;
}

@keyframes gradientMove{
  to{
    background-position:300% center;
  }
}

/* ================= ANIME GIRL ================= */

.anime-box{
  position:relative;
  width:245px;
  height:265px;
  margin-top:12px;
  z-index:4;

  animation:girlFloat 3.5s ease-in-out infinite;
}

@keyframes girlFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }
}

/* glow behind girl */

.anime-box:before{
  content:"";
  position:absolute;
  width:210px;
  height:210px;

  left:17px;
  top:25px;

  border-radius:50%;

  background:
    radial-gradient(circle,#ff66db,transparent 65%);

  filter:blur(25px);
  opacity:.55;
}

/* hair */

.hair{
  position:absolute;

  width:185px;
  height:190px;

  left:30px;
  top:27px;

  background:
    linear-gradient(
      135deg,
      #15102e,
      #39215f,
      #171331
    );

  border-radius:50% 50% 45% 45%;

  box-shadow:
    0 0 25px rgba(130,90,255,.5);

  z-index:1;
}

/* side hair */

.hair:before,
.hair:after{
  content:"";
  position:absolute;

  width:55px;
  height:145px;

  background:#20153e;

  top:80px;

  border-radius:30px;
}

.hair:before{
  left:-18px;
  transform:rotate(12deg);
}

.hair:after{
  right:-18px;
  transform:rotate(-12deg);
}

/* face */

.face{
  position:absolute;

  width:132px;
  height:145px;

  left:56px;
  top:58px;

  background:#ffd9c7;

  border-radius:48% 48% 48% 48%;

  z-index:3;

  box-shadow:
    inset 0 -5px 10px rgba(220,130,130,.15);
}

/* fringe */

.fringe{
  position:absolute;

  width:145px;
  height:75px;

  left:50px;
  top:45px;

  z-index:5;

  background:#20143c;

  border-radius:60% 60% 30% 35%;

  clip-path:polygon(
    0 0,
    100% 0,
    92% 60%,
    75% 45%,
    62% 85%,
    48% 48%,
    32% 90%,
    20% 50%,
    5% 70%
  );
}

/* eyes */

.eye{
  position:absolute;

  width:28px;
  height:38px;

  top:105px;

  background:
    radial-gradient(circle at 50% 35%,white 0 12%,#7e50ff 13% 48%,#17122c 50%);

  border-radius:50%;

  z-index:6;

  box-shadow:0 0 8px #8e71ff;
}

.eye.left{
  left:75px;
}

.eye.right{
  left:143px;
}

/* blink */

@keyframes blink{
  0%,45%,48%,100%{
    transform:scaleY(1);
  }

  46%,47%{
    transform:scaleY(.08);
  }
}

.eye{
  animation:blink 4s infinite;
}

  width:25px;
