<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Sai Songs 🎵</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#070719;
  color:white;
}

body{
  overflow-x:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}


/* ==================================================
   FIRST PAGE
================================================== */

#home{
  width:100%;
  min-height:100vh;
  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:18px 15px 30px;

  background:
    radial-gradient(circle at 10% 10%,rgba(255,0,200,.35),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(0,130,255,.35),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(130,30,255,.35),transparent 35%),
    linear-gradient(145deg,#050514,#151044,#070719);
}


/* stars */

.star{
  position:absolute;
  color:white;
  font-size:20px;
  pointer-events:none;

  animation:twinkle 1.5s infinite alternate;
}

.s1{top:8%;left:8%}
.s2{top:18%;left:25%;animation-delay:.3s}
.s3{top:12%;right:18%;animation-delay:.7s}
.s4{top:42%;left:5%;animation-delay:1s}
.s5{top:48%;right:7%;animation-delay:.5s}
.s6{bottom:20%;left:15%;animation-delay:.8s}
.s7{bottom:13%;right:18%;animation-delay:1.2s}
.s8{top:32%;right:30%;animation-delay:.2s}

@keyframes twinkle{
  from{
    opacity:.2;
    transform:scale(.7);
  }

  to{
    opacity:1;
    transform:scale(1.4);
  }
}


/* floating hearts */

.heart{
  position:absolute;
  bottom:-50px;
  font-size:20px;
  opacity:0;

  animation:heartFloat 7s linear infinite;
}

.h1{left:8%}
.h2{left:30%;animation-delay:2s}
.h3{right:25%;animation-delay:1s}
.h4{right:7%;animation-delay:3s}

@keyframes heartFloat{
  0%{
    bottom:-50px;
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  100%{
    bottom:110%;
    transform:rotate(360deg);
    opacity:0;
  }
}


/* title */

.title{
  position:relative;
  z-index:5;
  text-align:center;
}

.title h1{
  margin:0;

  font-size:38px;
  font-weight:900;
  font-style:italic;

  background:
    linear-gradient(
      90deg,
      #ff3bd4,
      white,
      #48c9ff,
      #ff3bd4
    );

  background-size:300%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:shine 4s linear infinite;
}

.title p{
  margin:5px 0 0;

  color:#c9c7e9;

  font-size:11px;
  letter-spacing:3px;
}

@keyframes shine{
  to{
    background-position:300%;
  }
}


/* ==================================================
   ANIME GIRL
================================================== */

.anime{
  width:230px;
  height:245px;

  position:relative;

  margin-top:12px;

  z-index:5;

  animation:breathe 3s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }
}

.glow{
  position:absolute;

  width:190px;
  height:190px;

  left:20px;
  top:30px;

  border-radius:50%;

  background:#ff35d0;

  filter:blur(55px);

  opacity:.35;
}


/* hair */

.hair{
  position:absolute;

  width:185px;
  height:195px;

  left:23px;
  top:28px;

  border-radius:50% 50% 45% 45%;

  background:
    linear-gradient(
      135deg,
      #171027,
      #593078,
      #171027
    );

  box-shadow:
    0 0 30px rgba(150,70,255,.6);
}


/* face */

.face{
  position:absolute;

  z-index:2;

  width:126px;
  height:137px;

  left:52px;
  top:60px;

  border-radius:48% 48% 50% 50%;

  background:#ffd9c9;
}


/* fringe */

.fringe{
  position:absolute;

  z-index:4;

  width:150px;
  height:75px;

  left:42px;
  top:45px;

  background:#21152f;

  border-radius:60% 60% 30% 30%;

  clip-path:polygon(
    0 0,
    100% 0,
    90% 65%,
    75% 48%,
    61% 90%,
    48% 50%,
    33% 88%,
    20% 48%,
    5% 70%
  );
}


/* eyes */

.eye{
  position:absolute;

  z-index:5;

  width:28px;
  height:36px;

  top:106px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 30%,
      white 0 12%,
      #7357ff 13% 48%,
      #17102a 50%
    );

  box-shadow:
    0 0 10px #765cff;

  animation:blink 4s infinite;
}

.eye.left{
  left:72px;
}

.eye.right{
  left:130px;
}

@keyframes blink{
  0%,45%,48%,100%{
    transform:scaleY(1);
  }

  46%,47%{
    transform:scaleY(.1);
  }
}


/* blush */

.blush{
  position:absolute;

  z-index:5;

  top:144px;

  width:26px;
  height:11px;

  border-radius:50%;

  background:#ff779c;

  opacity:.55;
}

.blush.left{
  left:60px;
}

.blush.right{
  left:144px;
}


/* mouth */

.mouth{
  position:absolute;

  z-index:5;

  top:151px;
  left:101px;

  width:27px;
  height:13px;

  border-bottom:3px solid #d66587;

  border-radius:0 0 50% 50%;
}


/* headphones */

.headphone{
  position:absolute;

  z-index:6;

  width:200px;
  height:165px;

  left:15px;
  top:54px;

  border:8px solid #a84cff;

  border-bottom:0;

  border-radius:110px 110px 0 0;

  box-shadow:
    0 0 20px #9b3dff;
}

.ear{
  position:absolute;

  z-index:7;

  top:111px;

  width:37px;
  height:58px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #ff38d1,
      #704cff
    );

  box-shadow:
    0 0 18px #ff38d1;
}

.ear.left{
  left:4px;
}

.ear.right{
  right:4px;
}


/* bow */

.bow{
  position:absolute;

  z-index:9;

  top:35px;
  right:5px;

  font-size:40px;

  filter:
    drop-shadow(0 0 10px #ff3fd5);

  animation:bow 2s infinite alternate;
}

@keyframes bow{
  to{
    transform:rotate(10deg) scale(1.1);
  }
}


/* welcome */

.welcome{
  position:relative;

  z-index:10;

  text-align:center;

  margin-top:-5px;
}

.welcome h2{
  margin:0;

  font-size:21px;

  text-shadow:
    0 0 10px #ff43d5,
    0 0 25px #7355ff;
}

.welcome p{
  margin:5px 0;

  color:#aaa8cb;

  font-size:11px;
}


/* choice */

#choice{
  position:relative;

  z-index:10;

  margin-top:7px;

  width:160px;
  height:40px;

  border-radius:25px;

  border:2px solid #ff50d9;

  background:rgba(255,255,255,.08);

  color:white;

  font-size:16px;
  font-weight:bold;

  box-shadow:
    0 0 18px rgba(255,50,210,.5);
}

#choice.sure{
  transform:scale(1.08);

  background:
    rgba(255,50,200,.2);
}


/* buttons */

.buttons{
  position:relative;

  z-index:10;

  display:flex;

  gap:10px;

  margin-top:9px;
}

#start{
  width:155px;
  height:58px;

  border:0;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #ff35c8,
      #7c42ff
    );

  color:white;

  font-size:25px;
  font-weight:900;

  box-shadow:
    0 0 28px rgba(255,45,205,.7);

  animation:startGlow 1.8s infinite alternate;
}

#out{
  width:82px;
  height:58px;

  border:0;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #367dff,
      #3942ce
    );

  color:white;

  font-size:21px;
  font-weight:bold;
}

#start.big{
  width:240px;
  height:95px;
  font-size:38px;
}

@keyframes startGlow{
  from{
    box-shadow:0 0 12px #ff35c8;
  }

  to{
    box-shadow:
      0 0 35px #ff35c8,
      0 0 60px #704cff;
  }
}


/* ==================================================
   COUNTDOWN
================================================== */

#countdown{
  display:none;

  width:100%;
  height:100vh;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle,#6e35bb,#070716);
}

#number{
  font-size:150px;

  font-weight:900;

  text-shadow:
    0 0 25px #ff39d2,
    0 0 60px #674dff;
}


/* ==================================================
   SONG PAGE
================================================== */

#songs{
  display:none;

  width:100%;
  min-height:100vh;

  background:
    radial-gradient(circle at 10% 20%,#7028a8,transparent 30%),
    radial-gradient(circle at 90% 80%,#1649a8,transparent 30%),
    #070716;
}

.header{
  height:70px;

  width:100%;

  display:flex;

  align-items:center;

  position:relative;

  border-bottom:
    1px solid rgba(255,255,255,.15);

  background:
    rgba(255,255,255,.07);
}

.back{
  background:none;

  border:0;

  color:white;

  font-size:40px;

  margin-left:12px;
}

.outText{
  font-size:18px;
  font-weight:bold;
}

.pageTitle{
  position:absolute;

  left:50%;

  transform:translateX(-50%);

  font-size:22px;

  font-weight:900;

  white-space:nowrap;

  text-shadow:
    0 0 15px #9c4cff;
}


/* song buttons */

.songGrid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:25px 14px;

  padding:45px 7%;
}

.song{
  min-height:80px;

  border:1px solid rgba(255,255,255,.2);

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(255,50,210,.25),
      rgba(60,80,255,.3)
    );

  color:white;

  font-size:16px;

  font-weight:bold;

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);

  transition:.25s;
}

.song:hover{
  transform:translateY(-5px);

  box-shadow:
    0 0 25px #a844ff;
}

.song:active{
  transform:scale(.92);
}


/* ==================================================
   MUSIC PAGE
================================================== */

.musicPage{
  display:none;

  width:100%;
  min-height:100vh;

  align-items:center;
  justify-content:center;

  position:relative;

  overflow:hidden;
}


/* different background for each song */

#music1{
  background:
    radial-gradient(circle at 20% 20%,#8b32d5,transparent 30%),
    radial-gradient(circle at 80% 80%,#126bc5,transparent 30%),
    #050510;
}

#music2{
  background:
    radial-gradient(circle at 15% 25%,#d72cae,transparent 30%),
    radial-gradient(circle at 85% 75%,#315eea,transparent 30%),
    #080510;
}


/* back */

.musicBack{
  position:absolute;

  top:20px;
  left:18px;

  width:55px;
  height:55px;

  border:0;

  border-radius:18px;

  background:
    rgba(255,255,255,.1);

  color:white;

  font-size:30px;

  z-index:10;
}


/* music card */

.musicCard{
  width:90%;
  max-width:420px;

  padding:30px 23px;

  text-align:center;

  border-radius:32px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.18);

  backdrop-filter:blur(15px);

  box-shadow:
    0 20px 70px rgba(0,0,0,.5);
}


/* disc */

.disc{
  width:170px;
  height:170px;

  margin:auto;

  border-radius:50%;

  background:
    repeating-radial-gradient(
      circle,
      #080808 0 5px,
      #292929 6px 8px
    );

  box-shadow:
    0 0 35px rgba(255,60,220,.5);

  position:relative;

  animation:
    spin 7s linear infinite;

  animation-play-state:paused;
}

.disc.playing{
  animation-play-state:running;
}


/* center */

.disc:after{
  content:"♫";

  position:absolute;

  width:45px;
  height:45px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#171717;

  color:white;

  font-size:23px;

  box-shadow:
    0 0 12px #ff4fd7;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* title */

.musicTitle{
  margin-top:25px;

  font-size:36px;

  font-weight:900;

  text-shadow:
    0 0 15px #ff45d7,
    0 0 30px #6650ff;
}

.artist{
  color:#aaa7c8;

  margin:
    7px 0 20px;
}


/* audio */

audio{
  width:100%;
}


/* play button */

.play{
  width:70px;
  height:70px;

  margin-top:18px;

  border:0;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #ff36cb,
      #674bff
    );

  color:white;

  font-size:25px;

  box-shadow:
    0 0 30px rgba(255,50,210,.6);
}


/* mobile */

@media(max-width:600px){

  .title h1{
    font-size:35px;
  }

  .anime{
    transform:scale(.88);

    margin-top:5px;
    margin-bottom:-10px;
  }

  .welcome h2{
    font-size:19px;
  }

  .pageTitle{
    font-size:18px;
  }

  .song{
    font-size:14px;
  }
}
</style>
</head>

<script>

/* ==================================================
   VARIABLES
================================================== */

const home =
document.getElementById("home");

const countdown =
document.getElementById("countdown");

const songs =
document.getElementById("songs");

const music1 =
document.getElementById("music1");

const music2 =
document.getElementById("music2");

const start =
document.getElementById("start");

const out =
document.getElementById("out");

const choice =
document.getElementById("choice");

const number =
document.getElementById("number");

const audio1 =
document.getElementById("audio1");

const audio2 =
document.getElementById("audio2");

const disc1 =
document.getElementById("disc1");

const disc2 =
document.getElementById("disc2");

const play1 =
document.getElementById("play1");

const play2 =
document.getElementById("play2");


let outCount = 0;


/* ==================================================
   START
================================================== */

start.onclick = function(){

  home.style.display = "none";

  countdown.style.display = "flex";

  let n = 3;

  number.textContent = n;

  const timer =
  setInterval(function(){

    n--;

    if(n > 0){

      number.textContent = n;

    }

    else{

      clearInterval(timer);

      countdown.style.display = "none";

      songs.style.display = "block";

    }

  },1000);

};


/* ==================================================
   OUT
================================================== */

out.onclick = function(){

  outCount++;

  if(outCount === 1){

    start.classList.add("big");

    choice.classList.add("sure");

    choice.textContent =
      "are you sure? 🤔";

  }

  else if(outCount === 2){

    choice.textContent =
      "ARE YOU SURE? 😳";

  }

  else{

    document.body.innerHTML = `

      <div style="
        width:100%;
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        background:#050510;
        color:white;
        text-align:center;
        font-family:Arial;
      ">

        <div style="font-size:65px">
          🌙✨
        </div>

        <h1>
          Goodbye 👋
        </h1>

        <p style="color:#aaa">
          Thanks for visiting Leon Sai Songs 🎵
        </p>

      </div>

    `;

  }

};


/* ==================================================
   BACK TO HOME
================================================== */

document.getElementById("backHome").onclick =
function(){

  stopAllMusic();

  songs.style.display = "none";

  home.style.display = "flex";

  outCount = 0;

  start.classList.remove("big");

  choice.classList.remove("sure");

  choice.textContent =
    "choice 😊";

};


/* ==================================================
   SONG 1
================================================== */

document.getElementById("song1").onclick =
function(){

  songs.style.display = "none";

  music1.style.display = "flex";

};


/* ==================================================
   SONG 2 — ဥပေက္ခာ
================================================== */

document.getElementById("song2").onclick =
function(){

  songs.style.display = "none";

  music2.style.display = "flex";

};


/* ==================================================
   MUSIC 1
================================================== */

play1.onclick = function(){

  if(audio1.paused){

    audio1.play();

    play1.textContent = "Ⅱ";

    disc1.classList.add("playing");

  }

  else{

    audio1.pause();

    play1.textContent = "▶";

    disc1.classList.remove("playing");

  }

};


/* ==================================================
   MUSIC 2
================================================== */

play2.onclick = function(){

  if(audio2.paused){

    audio2.play();

    play2.textContent = "Ⅱ";

    disc2.classList.add("playing");

  }

  else{

    audio2.pause();

    play2.textContent = "▶";

    disc2.classList.remove("playing");

  }

};


/* ==================================================
   BACK FROM MUSIC 1
================================================== */

document.getElementById("backMusic1").onclick =
function(){

  audio1.pause();

  disc1.classList.remove("playing");

  play1.textContent = "▶";

  music1.style.display = "none";

  songs.style.display = "block";

};


/* ==================================================
   BACK FROM MUSIC 2
================================================== */

document.getElementById("backMusic2").onclick =
function(){

  audio2.pause();

  disc2.classList.remove("playing");

  play2.textContent = "▶";

  music2.style.display = "none";

  songs.style.display = "block";

};


/* ==================================================
   STOP ALL
================================================== */

function stopAllMusic(){

  audio1.pause();
  audio2.pause();

  disc1.classList.remove("playing");
  disc2.classList.remove("playing");

  play1.textContent = "▶";
  play2.textContent = "▶";

}


/* ==================================================
   WHEN SONG ENDS
================================================== */

audio1.onended = function(){

  play1.textContent = "▶";

  disc1.classList.remove("playing");

};

audio2.onended = function(){

  play2.textContent = "▶";

  disc2.classList.remove("playing");

};

</script>

</body>
</html>
