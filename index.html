<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Sai Songs 🎵</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ================= HOME ================= */

#home{
  min-height:100vh;
  background:linear-gradient(135deg,#a9ffff,#72efff);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.spark{
  position:absolute;
  font-size:18px;
  animation:float 4s linear infinite;
  opacity:.7;
}

@keyframes float{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0}
  20%{opacity:.8}
  100%{transform:translateY(-20vh) rotate(360deg);opacity:0}
}

.file-box{
  width:150px;
  height:163px;
  background:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:0;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  animation:boxIn .7s ease;
  z-index:2;
}

@keyframes boxIn{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

.plus{
  font-size:20px;
  font-weight:bold;
}

.file-name{
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
}

.choice{
  margin-top:20px;
  width:112px;
  height:31px;
  border:0;
  border-radius:10px;
  background:#fff8ed;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.choice:hover{
  transform:scale(1.08);
}

.buttons{
  display:flex;
  gap:4px;
  margin-top:4px;
  z-index:3;
}

.start-btn,
.out-btn{
  border:0;
  color:white;
  font-weight:bold;
  font-size:20px;
  text-shadow:1px 1px 2px #777;
  cursor:pointer;
  transition:.45s cubic-bezier(.2,1.5,.4,1);
}

.start-btn{
  width:96px;
  height:49px;
  border-radius:17px;
  background:#0cff3c;
}

.out-btn{
  width:57px;
  height:49px;
  border-radius:17px;
  background:#ff3038;
}

.start-btn:active,
.out-btn:active,
.choice:active{
  transform:scale(.88);
}

.start-btn.big1{
  width:135px;
  height:70px;
  font-size:27px;
}

.start-btn.big2{
  width:190px;
  height:95px;
  font-size:35px;
  border-radius:28px;
  box-shadow:0 0 35px rgba(0,255,60,.65);
}

.choice.sure{
  width:145px;
  background:#ffe2a5;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.08)}
}

/* ================= COUNTDOWN ================= */

#countdown{
  display:none;
  min-height:100vh;
  background:#0da9eb;
  color:white;
  align-items:center;
  justify-content:center;
  font-size:210px;
  font-weight:900;
}

.count{
  animation:countPop .8s ease;
}

@keyframes countPop{
  0%{transform:scale(1.5);opacity:0}
  100%{transform:scale(1);opacity:1}
}

/* ================= SONG PAGE ================= */

#songs{
  display:none;
  min-height:100vh;
  background:#fff;
  position:relative;
}

.header{
  height:67px;
  background:#ffd27f;
  display:flex;
  align-items:center;
  position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.back{
  border:0;
  background:transparent;
  color:white;
  font-size:45px;
  font-weight:bold;
  line-height:1;
  cursor:pointer;
  margin-left:20px;
  text-shadow:1px 1px 2px #777;
}

.out-text{
  color:#111;
  font-size:24px;
  font-weight:bold;
  margin-left:3px;
  text-shadow:1px 1px 2px white;
}

.title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:28px;
  font-weight:bold;
  color:white;
  text-shadow:
    2px 2px 0 #666,
    -1px -1px 0 #666;
}

.song-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:74px 42px;
  padding:51px 10%;
}

.song{
  height:80px;
  border:0;
  border-radius:25px;
  background:#fff0b8;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  transition:.35s;
  position:relative;
  overflow:hidden;
}

.song:hover{
  transform:translateY(-7px) scale(1.04);
  box-shadow:0 12px 25px rgba(255,190,60,.3);
}

.song:active{
  transform:scale(.9);
}

.song::after{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  left:-30px;
  top:50%;
  animation:shine 2.5s infinite;
}

@keyframes shine{
  0%{left:-30px}
  100%{left:120%}
}

.bottom-buttons{
  display:flex;
  justify-content:center;
  gap:53px;
  margin-top:2px;
}

.heart{
  width:110px;
  height:92px;
  border:0;
  border-radius:25px;
  font-size:30px;
  cursor:pointer;
  transition:.3s;
}

.heart:first-child{
  background:#00f45a;
}

.heart:last-child{
  background:#ff5a0a;
}

.heart:hover{
  transform:translateY(-6px) rotate(-2deg);
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* ================= VIDEO ================= */

#videoPage{
  display:none;
  min-height:100vh;
  background:linear-gradient(135deg,#7dfcff,#b6a5ff);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  padding:20px;
}

.video-title{
  font-size:25px;
  font-weight:bold;
  color:white;
  text-shadow:2px 2px 3px #777;
}

#songVideo{
  width:min(92vw,700px);
  max-height:75vh;
  border-radius:25px;
  background:#000;
  box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.video-back{
  border:0;
  padding:12px 25px;
  border-radius:20px;
  background:white;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .file-box{
    width:150px;
    height:163px;
  }

  #countdown{
    font-size:170px;
  }

  .title{
    font-size:24px;
  }

  .song-grid{
    gap:74px 20px;
    padding:51px 10%;
  }

  .song{
    height:80px;
    font-size:18px;
  }

  .bottom-buttons{
    gap:53px;
  }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="home">

  <div class="spark" style="left:5%;animation-delay:0s">✨</div>
  <div class="spark" style="left:18%;animation-delay:1s">💙</div>
  <div class="spark" style="left:32%;animation-delay:2s">⭐</div>
  <div class="spark" style="left:48%;animation-delay:.5s">✨</div>
  <div class="spark" style="left:65%;animation-delay:1.5s">💫</div>
  <div class="spark" style="left:82%;animation-delay:2.5s">💙</div>
  <div class="spark" style="left:93%;animation-delay:3s">✨</div>

  <div class="file-box">

    <div class="plus">+</div>

    <div class="file-name">
      add file 1
    </div>

    <button class="choice" id="choiceBtn">
      choice 😊
    </button>

  </div>

  <div class="buttons">

    <button
      class="start-btn"
      id="startBtn"
      onclick="startWebsite()">
      start
    </button>

    <button
      class="out-btn"
      onclick="pressOut()">
      out
    </button>

  </div>

  <!-- video.b -->
  <video
    id="firstVideo"
    preload="metadata"
    playsinline
    style="display:none">
  </video>

</section>


<!-- ================= COUNTDOWN ================= -->

<section id="countdown">
  <div class="count" id="number">3</div>
</section>


<!-- ================= SONG PAGE ================= -->

<section id="songs">

  <div class="header">

    <button class="back" onclick="goHome()">←</button>

    <span class="out-text">out</span>

    <div class="title">
      Leon sai songs
    </div>

  </div>

  <div class="song-grid">

    <button class="song" onclick="openVideo()">
      (လုယွၼ်ႉၵဝ်)
    </button>

    <button class="song" onclick="openVideo()">
      ?
    </button>

    <button class="song" onclick="openVideo()">
      ?
    </button>

    <button class="song" onclick="openVideo()">
      ?
    </button>

    <button class="song" onclick="openVideo()">
      ?
    </button>

    <button class="song" onclick="openVideo()">
      ?
    </button>

  </div>

  <div class="bottom-buttons">

    <button class="heart" onclick="heartEffect(this)">
      ❤️
    </button>

    <button class="heart" onclick="heartEffect(this)">
      💔
    </button>

  </div>

</section>


<!-- ================= VIDEO PAGE ================= -->

<section id="videoPage">

  <div class="video-title">
    🎵 (လုယွၼ်ႉၵဝ်) 🎵
  </div>

  <video
    id="songVideo"
    controls
    playsinline
    preload="metadata">
  </video>

  <button class="video-back" onclick="closeVideo()">
    ← ပြန်သွားမယ်
  </button>

</section>


<script>

/* ==========================================
   VIDEO FILES

   Put these two files in the same folder:
   index.html
   video.b
   video.c
========================================== */

const firstVideo = document.getElementById("firstVideo");
const songVideo = document.getElementById("songVideo");

firstVideo.src = "video.b";
songVideo.src = "video.c";


/* ==========================================
   OUT BUTTON
========================================== */

let outCount = 0;

function pressOut(){

  outCount++;

  const start = document.getElementById("startBtn");
  const choice = document.getElementById("choiceBtn");

  if(outCount === 1){

    start.classList.remove("big2");
    start.classList.add("big1");

    choice.classList.add("sure");
    choice.innerHTML = "are you sure? 🤔";

    showMessage("are you sure?");

  }

  else if(outCount === 2){

    start.classList.remove("big1");
    start.classList.add("big2");

    choice.innerHTML = "ARE YOU SURE? 😳";

    showMessage("One more time... 😳");

  }

  else if(outCount >= 3){

    document.body.style.transition = "1s";
    document.body.style.opacity = "0";

    setTimeout(function(){
      window.location.href = "about:blank";
    },1000);

  }
}


/* ==========================================
   START
========================================== */

function startWebsite(){

  const home = document.getElementById("home");
  const countdown = document.getElementById("countdown");
  const number = document.getElementById("number");

  home.style.display = "none";
  countdown.style.display = "flex";

  let n = 3;

  number.innerHTML = n;

  let timer = setInterval(function(){

    n--;

    if(n > 0){

      number.innerHTML = n;

      number.classList.remove("count");
      void number.offsetWidth;
      number.classList.add("count");

    }

    else{

      clearInterval(timer);

      countdown.style.display = "none";
      document.getElementById("songs").style.display = "block";

    }

  },1000);
}


/* ==========================================
   GO HOME
========================================== */

function goHome(){

  document.getElementById("songs").style.display = "none";
  document.getElementById("videoPage").style.display = "none";
  document.getElementById("home").style.display = "flex";

  outCount = 0;

  document.getElementById("startBtn").classList.remove("big1","big2");

  const choice = document.getElementById("choiceBtn");

  choice.classList.remove("sure");
  choice.innerHTML = "choice 😊";
}


/* ==========================================
   OPEN VIDEO.C
========================================== */

function openVideo(){

  document.getElementById("songs").style.display = "none";

  document.getElementById("videoPage").style.display = "flex";

  songVideo.currentTime = 0;

  songVideo.play().catch(function(){

    /* Browser autoplay blocked.
       User can press play. */

  });
}


/* ==========================================
   CLOSE VIDEO
========================================== */

function closeVideo(){

  songVideo.pause();

  document.getElementById("videoPage").style.display = "none";
  document.getElementById("songs").style.display = "block";
}


/* ==========================================
   HEART EFFECT
========================================== */

function heartEffect(button){

  button.style.transform = "scale(1.3) rotate(8deg)";

  setTimeout(function(){

    button.style.transform = "";

  },350);

  for(let i=0;i<8;i++){

    const heart = document.createElement("div");

    heart.innerHTML = "💖";

    heart.style.position = "fixed";
    heart.style.left =
      (button.getBoundingClientRect().left +
      button.offsetWidth/2) + "px";

    heart.style.top =
      button.getBoundingClientRect().top + "px";

    heart.style.fontSize = "22px";
    heart.style.pointerEvents = "none";
    heart.style.zIndex = "9999";

    document.body.appendChild(heart);

    const x = (Math.random()-0.5)*180;
    const y = -(Math.random()*180+50);

    heart.animate(
      [
        {
          transform:"translate(0,0) scale(1)",
          opacity:1
        },
        {
          transform:
            `translate(${x}px,${y}px) scale(.4)`,
          opacity:0
        }
      ],
      {
        duration:900,
        easing:"ease-out"
      }
    );

    setTimeout(function(){
      heart.remove();
    },900);

  }
}


/* ==========================================
   MESSAGE EFFECT
========================================== */

function showMessage(text){

  const msg = document.createElement("div");

  msg.innerHTML = text;

  msg.style.position = "fixed";
  msg.style.left = "50%";
  msg.style.top = "18%";
  msg.style.transform = "translateX(-50%) scale(.5)";
  msg.style.padding = "14px 25px";
  msg.style.borderRadius = "20px";
  msg.style.background = "rgba(255,255,255,.92)";
  msg.style.color = "#333";
  msg.style.fontWeight = "bold";
  msg.style.fontSize = "18px";
  msg.style.boxShadow = "0 10px 30px rgba(0,0,0,.15)";
  msg.style.zIndex = "9999";

  document.body.appendChild(msg);

  msg.animate(
    [
      {transform:"translateX(-50%) scale(.5)",opacity:0},
      {transform:"translateX(-50%) scale(1)",opacity:1},
      {transform:"translateX(-50%) scale(1)",opacity:1},
      {transform:"translateX(-50%) scale(.5)",opacity:0}
    ],
    {
      duration:1800,
      easing:"ease-in-out"
    }
  );

  setTimeout(function(){
    msg.remove();
  },1800);
}

</script>

</body>
</html>
