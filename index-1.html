<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chipi Cute 💙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Segoe UI","Noto Sans Myanmar",sans-serif}
.page{position:absolute;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;text-align:center;overflow:hidden}
.page.active{display:flex}
#home{background:linear-gradient(180deg,#87ceeb,#dff7ff)}
#noPage{background:linear-gradient(180deg,#b9eaff,#fff)}
#helloPage{background:linear-gradient(180deg,#fff0f7,#ffe0ef)}
.bg{position:absolute;inset:0;pointer-events:none}
.bg span{position:absolute;font-size:20px;opacity:.6;animation:up 6s linear infinite}
.bg span:nth-child(1){left:5%;top:15%}.bg span:nth-child(2){left:18%;top:70%}
.bg span:nth-child(3){left:32%;top:25%}.bg span:nth-child(4){left:48%;top:78%}
.bg span:nth-child(5){left:65%;top:15%}.bg span:nth-child(6){left:82%;top:65%}
.bg span:nth-child(7){left:92%;top:25%}.bg span:nth-child(8){left:10%;top:45%}
@keyframes up{0%{transform:translateY(25px);opacity:0}35%{opacity:.65}100%{transform:translateY(-50px);opacity:0}}
.chipi,.kiss{position:relative;background:#fff;border-radius:50%;box-shadow:0 15px 30px #0002}
.chipi{width:190px;height:190px;animation:float 2s ease-in-out infinite}
.ear{position:absolute;top:-30px;width:65px;height:80px;background:#fff;border-radius:50%}
.ear.left{left:15px;transform:rotate(-25deg)}.ear.right{right:15px;transform:rotate(25deg)}
.eye{position:absolute;top:65px;width:22px;height:28px;background:#333;border-radius:50%}
.eye.left{left:50px}.eye.right{right:50px}
.eye:after{content:"";position:absolute;top:5px;left:5px;width:7px;height:7px;background:#fff;border-radius:50%}
.cheek{position:absolute;top:105px;width:30px;height:15px;background:#ff9db5;border-radius:50%}
.cheek.left{left:25px}.cheek.right{right:25px}
.mouth{position:absolute;top:95px;left:72px;width:45px;height:25px;border-bottom:5px solid #333;border-radius:50%}
@keyframes float{50%{transform:translateY(-15px)}}
.greeting{margin-top:25px;font-size:30px;font-weight:bold;color:#333;z-index:2}
.buttons{display:flex;gap:18px;margin-top:30px;z-index:2}
button{border:0;padding:15px 30px;font-size:18px;border-radius:30px;color:#fff;cursor:pointer;font-weight:bold;box-shadow:0 8px 18px #0002}
.no{background:#2196f3}.yes{background:#27ae60}
button:active{transform:scale(.94)}
.waiting{font-size:25px;animation:pulse 1s infinite;z-index:2}
@keyframes pulse{50%{transform:scale(1.08)}}
.impossible{display:none;flex-direction:column;align-items:center;z-index:2}
.impossible h1{font-size:42px;color:#ff477e;margin-bottom:20px}
.lyrics{font-size:24px;font-weight:bold;animation:pulse 1s infinite}
.poop{font-size:100px;display:none;margin-top:30px}
.poop.explode{display:block;animation:boom 2s forwards}
@keyframes boom{60%{transform:scale(2)}75%{transform:scale(3)}100%{transform:scale(7);opacity:0}}
.kiss{width:210px;height:210px;animation:come 2s forwards;z-index:2}
@keyframes come{0%{transform:scale(.7) translateY(80px);opacity:0}100%{transform:scale(1.2);opacity:1}}
.kiss-eye{position:absolute;top:70px;width:25px;height:8px;border-top:5px solid #333;border-radius:50%}
.kiss-eye.left{left:50px}.kiss-eye.right{right:50px}
.kiss-mouth{position:absolute;left:78px;top:105px;font-size:45px;animation:kiss .8s infinite alternate}
@keyframes kiss{to{transform:scale(1.3)}}
.final{margin-top:40px;font-size:32px;font-weight:bold;color:#ff4081;z-index:2}
.heart{position:absolute;font-size:35px;animation:heart 2s infinite}
.h1{left:20%;top:20%}.h2{right:20%;top:30%}
@keyframes heart{0%{transform:translateY(20px);opacity:0}50%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
#player{display:none}
@media(max-width:500px){.chipi{width:160px;height:160px}.greeting{font-size:25px}button{padding:13px 22px;font-size:16px}.impossible h1{font-size:36px}.lyrics{font-size:20px}.final{font-size:27px}}
</style>
</head>
<body>

<section id="home" class="page active">
<div class="bg"><span>😂</span><span>🤣</span><span>😆</span><span>😂</span><span>🤣</span><span>😹</span><span>😂</span><span>🤣</span></div>
<div class="chipi">
<div class="ear left"></div><div class="ear right"></div>
<div class="eye left"></div><div class="eye right"></div>
<div class="cheek left"></div><div class="cheek right"></div><div class="mouth"></div>
</div>
<div class="greeting">Hello ငယ်ချင်း 💙</div>
<div class="buttons">
<button class="no" onclick="noHello()">No Hello</button>
<button class="yes" onclick="hello()">Hello 💚</button>
</div>
</section>

<section id="noPage" class="page">
<div class="bg"><span>😂</span><span>🤣</span><span>😭</span><span>😂</span><span>🤣</span><span>😆</span></div>
<div id="waiting" class="waiting">ခဏလေးစောင့်နော်... 😌</div>
<div id="impossible" class="impossible">
<h1>Impossible 😭</h1>
<div class="lyrics">🎵 Impossible... Impossible... 🎵</div>
<div id="poop" class="poop">💩</div>
</div>
<video id="player" preload="auto" playsinline>
<source src="impossible.mp4" type="video/mp4">
</video>
</section>

<section id="helloPage" class="page">
<div class="heart h1">💗</div><div class="heart h2">💕</div>
<div class="kiss"><div class="kiss-eye left"></div><div class="kiss-eye right"></div><div class="kiss-mouth">💋</div></div>
<div class="final">ပျော်ရွှင်ပါစေ 💖✨</div>
</section>

<script>
function show(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
function hello(){show("helloPage")}
function noHello(){
 show("noPage");
 const waiting=document.getElementById("waiting");
 const impossible=document.getElementById("impossible");
 const poop=document.getElementById("poop");
 const player=document.getElementById("player");
 waiting.style.display="block";
 impossible.style.display="none";
 poop.classList.remove("explode");
 player.currentTime=0;
 setTimeout(()=>{
   waiting.style.display="none";
   impossible.style.display="flex";
   player.play().catch(e=>console.log("Video/audio error:",e));
   setTimeout(()=>poop.classList.add("explode"),2500);
 },3000);
}
</script>
</body>
</html>
